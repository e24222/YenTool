<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>飲食紀錄</title>
<meta name="theme-color" content="#fdf1ec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg1:#eef6fb;
  --bg2:#dcedf6;
  --bg3:#cbe0ee;
  --card:#fbfeff;
  --card2:#eef6fb;
  --ink:#33495c;
  --ink2:#6f8fa6;
  --ink3:#a7c2d4;
  --rose:#5fa8d3;
  --rose-deep:#2f7aa8;
  --gold:#d8ab6f;
  --peach:#f0c48d;
  --lav:#9fc3e0;
  --border:rgba(120,165,195,0.20);
  --shadow:0 10px 30px rgba(95,150,180,0.16);
  --radius:22px;
}

body{
  font-family:"Noto Sans TC",-apple-system,sans-serif;
  color:var(--ink);
  min-height:100vh;
  background:
    radial-gradient(circle at 12% 8%, rgba(190,222,242,0.6), transparent 45%),
    radial-gradient(circle at 90% 0%, rgba(216,171,111,0.25), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(175,200,235,0.32), transparent 45%),
    linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
  background-attachment:fixed;
  padding-bottom:80px;
  -webkit-tap-highlight-color:transparent;
}

.wrap{max-width:520px;margin:0 auto;padding:0 18px}

header{padding:36px 0 8px;text-align:center;position:relative}
.crown{font-size:26px;letter-spacing:2px;opacity:.7}
h1{
  font-family:"Noto Serif TC","Cormorant Garamond",serif;
  font-size:28px;font-weight:700;color:var(--rose-deep);
  margin-top:6px;letter-spacing:.04em;
}
.sub{font-size:12.5px;color:var(--ink2);margin-top:6px;letter-spacing:.05em}

.datebar{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin-top:20px;
}
.datebtn{
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--border);background:var(--card);
  color:var(--rose-deep);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(95,150,180,0.14);
}
.datebtn:active{background:var(--card2)}
.datelabel{
  font-family:"Noto Serif TC",serif;font-size:15.5px;font-weight:600;
  min-width:130px;text-align:center;color:var(--ink);
}
.datelabel .today-tag{
  display:inline-block;margin-left:6px;font-size:10.5px;
  background:var(--rose);color:#fff;padding:1px 8px;border-radius:999px;
  font-family:"Noto Sans TC",sans-serif;font-weight:600;vertical-align:1px;
}

.syncrow{
  text-align:center;font-size:11.5px;color:var(--ink3);margin-top:10px;
  cursor:pointer;user-select:none;
}

.tabbar{display:flex;justify-content:center;gap:8px;margin-top:18px}
.tabbtn{
  background:var(--card);border:1px solid var(--border);color:var(--ink2);
  font-size:13px;font-weight:600;padding:8px 22px;border-radius:999px;
  cursor:pointer;font-family:inherit;
}
.tabbtn.active{
  background:linear-gradient(120deg,var(--rose-deep),var(--rose));
  color:#fff;border-color:transparent;
}

.calnav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px}
.calmonth{font-family:"Noto Serif TC",serif;font-size:15.5px;font-weight:600;min-width:110px;text-align:center;color:var(--ink)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calwd{text-align:center;font-size:11px;color:var(--ink3);padding-bottom:4px}
.calday{
  aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:12.5px;color:var(--ink);
  cursor:pointer;border:1.5px solid transparent;background:var(--card2);
}
.calday.empty{visibility:hidden;cursor:default}
.calday.today{border-color:var(--rose-deep)}
.calday .kc{font-size:8.5px;color:var(--ink2);margin-top:2px}
.calday.ok{background:rgba(111,169,206,0.28)}
.calday.over{background:rgba(224,145,116,0.38)}
.calday.none{background:var(--card2);color:var(--ink3)}
.callegend{display:flex;justify-content:center;gap:14px;margin-top:14px;font-size:11px;color:var(--ink2)}
.callegend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.dot.ok{background:#5fa3c9}
.dot.over{background:#dd8f68}
.dot.none{background:#d8e3ec}

main{max-width:520px;margin:0 auto;padding:20px 18px 0}

.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px 20px;
  margin-bottom:18px;
}

.panel-title{
  font-family:"Noto Serif TC",serif;font-size:15px;font-weight:700;
  color:var(--rose-deep);margin-bottom:14px;
  display:flex;align-items:center;gap:6px;
}

/* progress bars */
.metric{margin-bottom:16px}
.metric:last-child{margin-bottom:0}
.metric-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.metric-name{font-size:13px;color:var(--ink);font-weight:500;display:flex;align-items:center;gap:5px}
.metric-val{font-size:12px;color:var(--ink2)}
.metric-val b{color:var(--rose-deep);font-weight:700}
.track{
  height:10px;border-radius:999px;background:var(--card2);
  overflow:hidden;border:1px solid var(--border);
}
.fill{height:100%;border-radius:999px;transition:width .5s ease}
.fill.water{background:linear-gradient(90deg,#9ecbe0,#c9e3ec)}
.fill.protein{background:linear-gradient(90deg,var(--rose-deep),var(--rose))}
.fill.fat{background:linear-gradient(90deg,var(--gold),var(--peach))}
.fill.carb{background:linear-gradient(90deg,var(--lav),#d6e6f5)}
.fill.kcal{background:linear-gradient(90deg,var(--rose-deep),var(--gold))}

/* macro ratio */
.ratio-bar{
  display:flex;height:22px;border-radius:999px;overflow:hidden;
  border:1px solid var(--border);margin-top:4px;
}
.ratio-seg{display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden}
.ratio-seg.p{background:var(--rose-deep)}
.ratio-seg.f{background:var(--gold)}
.ratio-seg.c{background:var(--lav)}
.ratio-legend{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:11.5px;color:var(--ink2)}
.ratio-legend span.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.dot.p{background:var(--rose-deep)}.dot.f{background:var(--gold)}.dot.c{background:var(--lav)}

/* water quick add */
.water-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.qbtn{
  flex:1;min-width:64px;background:var(--card2);border:1px solid var(--border);
  border-radius:12px;color:var(--rose-deep);font-size:12.5px;font-weight:600;
  padding:9px 6px;cursor:pointer;font-family:inherit;
}
.qbtn:active{background:#cbe0ee}
.qbtn.minus{color:var(--ink2)}

/* meals list */
.meal-card{
  background:var(--card2);border:1px solid var(--border);
  border-radius:16px;padding:14px 16px;margin-bottom:10px;
  position:relative;
}
.meal-card:last-child{margin-bottom:0}
.meal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.meal-name{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.4}
.meal-time{font-size:11px;color:var(--ink3);margin-top:2px}
.est-tag{
  font-size:10px;background:rgba(216,171,111,0.25);color:#a5773a;
  padding:1px 7px;border-radius:999px;margin-left:6px;font-weight:600;
}
.meal-macros{font-size:12px;color:var(--ink2);margin-top:8px}
.meal-macros b{color:var(--rose-deep)}
.meal-del{
  background:none;border:none;color:var(--ink3);font-size:16px;
  cursor:pointer;padding:2px 4px;line-height:1;
}
.empty{
  text-align:center;padding:30px 10px;color:var(--ink3);font-size:13px;
  font-family:"Noto Serif TC",serif;
}

/* add meal form */
.addform{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border)}
.addform.open{display:block}
.addform input{
  width:100%;background:var(--card2);border:1px solid var(--border);
  border-radius:10px;color:var(--ink);font-size:14px;padding:9px 12px;
  margin-bottom:8px;font-family:inherit;
}
.addform .row4{display:flex;gap:6px}
.addform .row4 input{text-align:center}
.addform label.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);margin-bottom:10px}
.addform .actions{display:flex;gap:8px}
.btn{
  flex:1;border:none;border-radius:12px;padding:11px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;
}
.btn.primary{background:linear-gradient(120deg,var(--rose-deep),var(--rose));color:#fff}
.btn.ghost{background:var(--card);color:var(--ink2);border:1px solid var(--border)}
.addtoggle{
  width:100%;text-align:center;background:none;border:1px dashed var(--border);
  border-radius:14px;padding:12px;color:var(--rose-deep);font-size:13px;
  cursor:pointer;font-family:inherit;margin-top:4px;
}

.footer{text-align:center;font-size:11px;color:var(--ink3);margin-top:26px;letter-spacing:.05em}

/* token overlay */
#tokenOverlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(41,60,77,0.45);backdrop-filter:blur(2px);
  align-items:center;justify-content:center;padding:24px;
}
.tokenbox{
  background:var(--card);border-radius:20px;padding:26px;width:100%;max-width:360px;
  box-shadow:0 20px 50px rgba(41,60,77,0.25);
}
.tokenbox h3{font-family:"Noto Serif TC",serif;font-size:17px;color:var(--rose-deep);margin-bottom:8px}
.tokenbox p{font-size:12.5px;color:var(--ink2);line-height:1.7;margin-bottom:16px}
.tokenbox code{background:var(--card2);padding:1px 6px;border-radius:5px}
.tokenbox input{
  width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;
  color:var(--ink);font-size:14px;padding:10px 12px;font-family:inherit;margin-bottom:10px;
}
#tokenTestResult{font-size:12.5px;min-height:16px;margin-bottom:8px;text-align:center}
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  background:var(--rose-deep);color:#fff;padding:10px 22px;border-radius:20px;
  font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;
  white-space:nowrap;z-index:999;box-shadow:0 8px 20px rgba(47,122,168,0.35);
}
.toast.show{opacity:1}

@media (min-width:700px){
  .wrap{max-width:640px}
  h1{font-size:36px}
  .sub{font-size:15px}
  .crown{font-size:32px}
  .datelabel{font-size:19px}
  .datebtn{width:40px;height:40px;font-size:18px}
  .syncrow{font-size:13.5px}
  .tabbtn{font-size:15px;padding:10px 26px}
  .panel{padding:30px 32px;border-radius:26px}
  .panel-title{font-size:18px;margin-bottom:18px}
  .metric{margin-bottom:20px}
  .metric-name{font-size:15.5px}
  .metric-val{font-size:14.5px}
  .track{height:13px}
  .qbtn{font-size:14.5px;padding:12px 8px}
  .ratio-bar{height:26px}
  .ratio-seg{font-size:12px}
  .ratio-legend{font-size:13.5px;gap:22px}
  .meal-card{padding:18px 20px}
  .meal-name{font-size:16.5px}
  .meal-time{font-size:12.5px}
  .est-tag{font-size:11px}
  .meal-macros{font-size:14px;margin-top:10px}
  .meal-del{font-size:19px}
  .empty{font-size:15px;padding:40px 10px}
  .addtoggle{font-size:15px;padding:14px}
  .addform input{font-size:15.5px;padding:11px 14px}
  .addform label.chk{font-size:14px}
  .btn{font-size:15.5px;padding:13px}
  .calnav{gap:22px;margin-bottom:20px}
  .calmonth{font-size:18px;min-width:130px}
  .calwd{font-size:13px}
  .calgrid{gap:9px}
  .calday{font-size:14.5px;border-radius:14px}
  .calday .kc{font-size:10px}
  .callegend{font-size:13px;gap:20px}
  .footer{font-size:12.5px}
  .tokenbox{max-width:420px;padding:32px}
  .tokenbox h3{font-size:19px}
  .tokenbox p{font-size:14px}
  .tokenbox input{font-size:15.5px;padding:12px 14px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="crown">🌸</div>
    <h1>我的飲食紀錄</h1>
    <div class="sub">記錄每一餐，溫柔地靠近目標</div>
    <div class="tabbar">
      <button class="tabbtn active" id="tab-day" onclick="switchTab('day')">單日</button>
      <button class="tabbtn" id="tab-cal" onclick="switchTab('cal')">月曆</button>
    </div>
    <div class="datebar" id="datebar">
      <button class="datebtn" onclick="changeDay(-1)">‹</button>
      <div class="datelabel" id="dateLabel"></div>
      <button class="datebtn" onclick="changeDay(1)">›</button>
    </div>
    <div class="syncrow" id="syncRow" onclick="showTokenUI()">☁️ 同步中…</div>
  </div>
</header>

<main class="wrap">

<div id="dayView">
  <div class="panel">
    <div class="panel-title">🍯 今日累計</div>
    <div class="metric">
      <div class="metric-head">
        <div class="metric-name">💧 飲水量</div>
        <div class="metric-val" id="mv-water"></div>
      </div>
      <div class="track"><div class="fill water" id="mf-water"></div></div>
    </div>
    <div class="metric">
      <div class="metric-head">
        <div class="metric-name">🌹 蛋白質</div>
        <div class="metric-val" id="mv-p"></div>
      </div>
      <div class="track"><div class="fill protein" id="mf-p"></div></div>
    </div>
    <div class="metric">
      <div class="metric-head">
        <div class="metric-name">🍥 脂肪</div>
        <div class="metric-val" id="mv-f"></div>
      </div>
      <div class="track"><div class="fill fat" id="mf-f"></div></div>
    </div>
    <div class="metric">
      <div class="metric-head">
        <div class="metric-name">🍇 碳水</div>
        <div class="metric-val" id="mv-c"></div>
      </div>
      <div class="track"><div class="fill carb" id="mf-c"></div></div>
    </div>
    <div class="metric">
      <div class="metric-head">
        <div class="metric-name">✨ 熱量</div>
        <div class="metric-val" id="mv-kcal"></div>
      </div>
      <div class="track"><div class="fill kcal" id="mf-kcal"></div></div>
    </div>

    <div class="water-row">
      <button class="qbtn" onclick="addWater(250)">+250cc</button>
      <button class="qbtn" onclick="addWater(500)">+500cc</button>
      <button class="qbtn" onclick="addWater(1000)">+1000cc</button>
      <button class="qbtn minus" onclick="addWater(-250)">−250cc</button>
    </div>
  </div>

  <div class="panel" id="ratioPanel">
    <div class="panel-title">🎀 三大營養素比例</div>
    <div class="ratio-bar" id="ratioBar"></div>
    <div class="ratio-legend">
      <span><span class="dot p"></span>蛋白質</span>
      <span><span class="dot f"></span>脂肪</span>
      <span><span class="dot c"></span>碳水</span>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">🍽️ 本日餐點</div>
    <div id="mealsList"></div>

    <button class="addtoggle" onclick="toggleAddForm()" id="addToggleBtn">＋ 手動新增一筆</button>
    <div class="addform" id="addForm">
      <input type="text" id="af-desc" placeholder="品項（例：肉絲燴飯 約200g）">
      <div class="row4">
        <input type="number" id="af-p" placeholder="蛋白 p">
        <input type="number" id="af-f" placeholder="脂肪 f">
        <input type="number" id="af-c" placeholder="碳水 c">
        <input type="number" id="af-kcal" placeholder="kcal">
      </div>
      <label class="chk"><input type="checkbox" id="af-est" checked> 這是估算值</label>
      <div class="actions">
        <button class="btn ghost" onclick="toggleAddForm()">取消</button>
        <button class="btn primary" onclick="submitMeal()">加入</button>
      </div>
    </div>
  </div>

</div>

<div id="calView" style="display:none">
  <div class="panel">
    <div class="calnav">
      <button class="datebtn" onclick="changeMonth(-1)">‹</button>
      <div class="calmonth" id="calMonthLabel"></div>
      <button class="datebtn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="calgrid" id="calGrid"></div>
    <div class="callegend">
      <span><span class="dot ok"></span>達標內</span>
      <span><span class="dot over"></span>超標</span>
      <span><span class="dot none"></span>無紀錄</span>
    </div>
  </div>
</div>

  <div class="footer">e24222.github.io · YenTool</div>
</main>

<div class="toast" id="toast"></div>

<div id="tokenOverlay">
  <div class="tokenbox">
    <h3>🔐 連結你的資料</h3>
    <p>輸入有 <code>gist</code> 權限的 GitHub Token，這台裝置就能讀取／更新你的飲食紀錄（跟聊天室是同一份資料）。</p>
    <input id="tokenInput" type="password" placeholder="ghp_xxxxxxxxxxxx">
    <div id="tokenTestResult"></div>
    <div class="actions" style="display:flex;gap:10px">
      <button class="btn ghost" onclick="hideTokenUI()">關閉</button>
      <button class="btn primary" onclick="applyToken()">儲存並連結</button>
    </div>
  </div>
</div>

<script>
const GIST_ID = '753eefa68ad8cb692c64908125e8c48d';
const GIST_FILE = 'yentool-diet.json';
const DEFAULT_TARGETS = {water_cc:4500, protein_g:150, fat_g:80, carb_g:210, kcal:2160};

let D = { targets: {...DEFAULT_TARGETS}, days: {} };
let curDate = todayStr();
let _syncTimer = null;

function todayStr(){
  const d = new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function getToken(){ return localStorage.getItem('diet_token') || ''; }
function saveToken(t){ localStorage.setItem('diet_token', t.trim()); }

function load(){
  try { D = JSON.parse(localStorage.getItem('diet_cache') || 'null') || { targets:{...DEFAULT_TARGETS}, days:{} }; }
  catch(e){ D = { targets:{...DEFAULT_TARGETS}, days:{} }; }
}
function cacheLocal(){ localStorage.setItem('diet_cache', JSON.stringify(D)); }

function scheduleSync(){
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(syncToGist, 1200);
}

async function syncToGist(){
  const token = getToken();
  if(!token) return;
  setSyncStatus('syncing');
  try{
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      method:'PATCH',
      headers:{ 'Authorization':`token ${token}`, 'Content-Type':'application/json' },
      body: JSON.stringify({ files:{ [GIST_FILE]: { content: JSON.stringify(D) } } })
    });
    if(!res.ok) throw new Error(res.status);
    setSyncStatus('ok');
  }catch(e){ setSyncStatus('err'); }
}

async function loadFromGist(){
  const token = getToken();
  if(!token){ showTokenUI(); render(); return; }
  setSyncStatus('syncing');
  try{
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, { headers:{ 'Authorization':`token ${token}` } });
    if(res.status===401){ showTokenUI(); setSyncStatus('err'); render(); return; }
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();
    const content = data.files[GIST_FILE]?.content;
    if(content){
      const remote = JSON.parse(content);
      if(remote && remote.days){
        D = remote;
        cacheLocal();
      }
    }
    setSyncStatus('ok');
  }catch(e){ setSyncStatus('err'); }
  render();
}

function setSyncStatus(state){
  const el = document.getElementById('syncRow');
  if(!el) return;
  const map = { syncing:'☁️ 同步中…', ok:'✓ 已同步', err:'⚠️ 同步失敗，點我設定 token' };
  el.textContent = map[state] || '';
}

function showTokenUI(){
  document.getElementById('tokenOverlay').style.display = 'flex';
  const inp = document.getElementById('tokenInput');
  if(inp) inp.value = getToken();
  document.getElementById('tokenTestResult').textContent = '';
}
function hideTokenUI(){ document.getElementById('tokenOverlay').style.display = 'none'; }

async function applyToken(){
  const t = document.getElementById('tokenInput').value.trim();
  const res = document.getElementById('tokenTestResult');
  if(!t){ res.style.color='#c7a9a3'; res.textContent='尚未輸入 Token'; return; }
  res.style.color='#c7a9a3'; res.textContent='驗證中…';
  try{
    const r = await fetch('https://api.github.com/gists/'+GIST_ID, { headers:{'Authorization':'token '+t} });
    if(r.ok){
      saveToken(t);
      res.style.color='#7fae7f'; res.textContent='✅ 連結成功';
      setTimeout(()=>{ hideTokenUI(); loadFromGist(); }, 500);
    } else if(r.status===401){
      res.style.color='#d17a7a'; res.textContent='❌ Token 無效或已失效';
    } else {
      res.style.color='#d17a7a'; res.textContent='❌ 錯誤：'+r.status;
    }
  }catch(e){ res.style.color='#d17a7a'; res.textContent='❌ 網路錯誤'; }
}

/* ── data helpers ── */
function dayData(dateStr){
  if(!D.days[dateStr]) D.days[dateStr] = { water_cc:0, meals:[] };
  return D.days[dateStr];
}

function addWater(delta){
  const d = dayData(curDate);
  d.water_cc = Math.max(0, (d.water_cc||0) + delta);
  cacheLocal(); scheduleSync(); render();
}

function toggleAddForm(){
  document.getElementById('addForm').classList.toggle('open');
}

function submitMeal(){
  const desc = document.getElementById('af-desc').value.trim();
  const p = parseFloat(document.getElementById('af-p').value)||0;
  const f = parseFloat(document.getElementById('af-f').value)||0;
  const c = parseFloat(document.getElementById('af-c').value)||0;
  const kcal = parseFloat(document.getElementById('af-kcal').value)|| Math.round(p*4+f*9+c*4);
  const est = document.getElementById('af-est').checked;
  if(!desc){ toast('請輸入品項名稱'); return; }
  const d = dayData(curDate);
  const now = new Date();
  const time = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  d.meals.push({ time, desc, p, f, c, kcal, estimated: est });
  cacheLocal(); scheduleSync();
  ['af-desc','af-p','af-f','af-c','af-kcal'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('addForm').classList.remove('open');
  toast('已加入 🌸');
  render();
}

function delMeal(idx){
  const d = dayData(curDate);
  d.meals.splice(idx,1);
  cacheLocal(); scheduleSync(); render();
}

function changeDay(delta){
  const d = new Date(curDate+'T00:00:00');
  d.setDate(d.getDate()+delta);
  curDate = todayStrFrom(d);
  render();
}
function todayStrFrom(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function fmtDate(dateStr){
  const [y,m,d] = dateStr.split('-');
  const isToday = dateStr === todayStr();
  return `${parseInt(m)}月${parseInt(d)}日${isToday?' <span class="today-tag">今天</span>':''}`;
}

function pct(v,max){ return Math.min(100, Math.round((v/max)*100)); }

function render(){
  const t = D.targets || DEFAULT_TARGETS;
  const d = dayData(curDate);
  document.getElementById('dateLabel').innerHTML = fmtDate(curDate);

  let sp=0, sf=0, sc=0, skcal=0;
  d.meals.forEach(m=>{ sp+=+m.p||0; sf+=+m.f||0; sc+=+m.c||0; skcal+=+m.kcal||0; });

  setMetric('water', d.water_cc||0, t.water_cc, 'cc');
  setMetric('p', sp, t.protein_g, 'g');
  setMetric('f', sf, t.fat_g, 'g');
  setMetric('c', sc, t.carb_g, 'g');
  setMetric('kcal', skcal, t.kcal, 'kcal');

  // ratio bar
  const totalKcalFromMacro = sp*4 + sf*9 + sc*4;
  const bar = document.getElementById('ratioBar');
  if(totalKcalFromMacro > 0){
    const pP = Math.round(sp*4/totalKcalFromMacro*1000)/10;
    const pF = Math.round(sf*9/totalKcalFromMacro*1000)/10;
    const pC = Math.round((100 - pP - pF)*10)/10;
    bar.innerHTML = `
      <div class="ratio-seg p" style="width:${pP}%">${pP>=8?pP+'%':''}</div>
      <div class="ratio-seg f" style="width:${pF}%">${pF>=8?pF+'%':''}</div>
      <div class="ratio-seg c" style="width:${pC}%">${pC>=8?pC+'%':''}</div>
    `;
  } else {
    bar.innerHTML = `<div class="ratio-seg" style="width:100%;background:var(--card2);color:var(--ink3)">尚無記錄</div>`;
  }

  // meals list
  const list = document.getElementById('mealsList');
  if(d.meals.length===0){
    list.innerHTML = `<div class="empty">🌷 這天還沒有記錄</div>`;
  } else {
    list.innerHTML = d.meals.map((m,i)=>`
      <div class="meal-card">
        <div class="meal-top">
          <div>
            <div class="meal-name">${escapeHtml(m.desc)}${m.estimated?'<span class="est-tag">估</span>':''}</div>
            <div class="meal-time">${m.time||''}</div>
          </div>
          <button class="meal-del" onclick="delMeal(${i})">✕</button>
        </div>
        <div class="meal-macros"><b>${m.p||0}</b>p ｜ <b>${m.f||0}</b>f ｜ <b>${m.c||0}</b>c ｜ <b>${m.kcal||0}</b> kcal</div>
      </div>
    `).join('');
  }
}

function setMetric(key, val, max, unit){
  const p = pct(val, max);
  document.getElementById('mf-'+key).style.width = p+'%';
  const valFmt = unit==='cc'||unit==='kcal' ? Math.round(val).toLocaleString() : Math.round(val*10)/10;
  const maxFmt = unit==='cc'||unit==='kcal' ? Math.round(max).toLocaleString() : max;
  document.getElementById('mv-'+key).innerHTML = `<b>${valFmt}</b>／${maxFmt} ${unit}（${p}%）`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2000);
}

let calYear, calMonthIdx;

function switchTab(tab){
  document.getElementById('tab-day').classList.toggle('active', tab==='day');
  document.getElementById('tab-cal').classList.toggle('active', tab==='cal');
  document.getElementById('dayView').style.display = tab==='day' ? '' : 'none';
  document.getElementById('calView').style.display = tab==='cal' ? '' : 'none';
  if(tab==='cal') renderCalendar();
}

function changeMonth(delta){
  if(calYear===undefined){ const d=new Date(); calYear=d.getFullYear(); calMonthIdx=d.getMonth(); }
  calMonthIdx += delta;
  if(calMonthIdx<0){ calMonthIdx=11; calYear--; }
  if(calMonthIdx>11){ calMonthIdx=0; calYear++; }
  renderCalendar();
}

function renderCalendar(){
  if(calYear===undefined){ const d=new Date(); calYear=d.getFullYear(); calMonthIdx=d.getMonth(); }
  document.getElementById('calMonthLabel').textContent = `${calYear}年 ${calMonthIdx+1}月`;
  const grid = document.getElementById('calGrid');
  const firstDay = new Date(calYear, calMonthIdx, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(calYear, calMonthIdx+1, 0).getDate();
  const targetKcal = (D.targets||DEFAULT_TARGETS).kcal;
  const todayS = todayStr();

  let html = ['日','一','二','三','四','五','六'].map(w=>`<div class="calwd">${w}</div>`).join('');
  for(let i=0;i<startWeekday;i++) html += `<div class="calday empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const ds = `${calYear}-${String(calMonthIdx+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dd = D.days[ds];
    let cls = 'none', kcalTxt = '';
    if(dd && dd.meals && dd.meals.length){
      const kcal = dd.meals.reduce((s,m)=>s+(+m.kcal||0),0);
      cls = kcal > targetKcal ? 'over' : 'ok';
      kcalTxt = Math.round(kcal).toLocaleString();
    }
    const todayCls = ds===todayS ? ' today' : '';
    html += `<div class="calday ${cls}${todayCls}" onclick="jumpToDate('${ds}')">
      <div>${day}</div>
      ${kcalTxt ? `<div class="kc">${kcalTxt}</div>` : ''}
    </div>`;
  }
  grid.innerHTML = html;
}

function jumpToDate(ds){
  curDate = ds;
  switchTab('day');
  render();
}

/* ── init ── */
load();
render();
loadFromGist();
</script>
</body>
</html>
